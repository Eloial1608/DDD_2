services:
  core-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    env_file:
      - /etc/gathered/core/.env
    command: ["start:core:server"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2GB"
        reservations:
          cpus: "1"
          memory: "1GB"

  threads-service-server:
    restart: always
