services:
  core-service-server:
    depends_on:
      - db
      - rabbitmq
    build:
      context: ./
      dockerfile: ./Dockerfile
    command: start:core:server:dev
    ports:
      - 5004:5004
  
  auth-service-server:
    depends_on:
      - db
      - rabbitmq
    build:
      context: ./
      dockerfile: ./Dockerfile
    command: start:auth:server:dev
    ports:
      - 5000:5000
  
  posts-service-server:
    depends_on:
      - db
      - rabbitmq
    build:
      context: ./
      dockerfile: ./Dockerfile
    command: start:posts:server:dev
    ports:
      - 5000:5000

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    environment:
      RABBITMQ_DEFAULT_USER: "core"
      RABBITMQ_DEFAULT_PASS: "core"
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq

  db:
    image: postgres:17.1
    restart: always
    environment:
      POSTGRES_PASSWORD: superuser
      POSTGRES_USER: superuser
    ports:
      - 5432:5432
    volumes:
      - ./etc/database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
