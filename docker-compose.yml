services:
  core-service-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - 5004:5004
    env_file:
      - /etc/gathered/core/.env
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2GB"
        reservations:
          cpus: "1"
          memory: "1GB"

  threads-service-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - 5005:5005
    env_file:
      - /etc/gathered/threads/.env
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1GB"
        reservations:
          cpus: "0.5"
          memory: "512MB"
  
  course-service-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - 5006:5006
    env_file:
      - /etc/gathered/course/.env
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1GB"
        reservations:
          cpus: "0.5"
          memory: "512MB"
  
  auth-service-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - 5007:5007
    env_file:
      - /etc/gathered/auth/.env
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2GB"
        reservations:
          cpus: "1"
          memory: "1GB"

  media-service-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - 5008:5008
    env_file:
      - /etc/gathered/media/.env
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1GB"
        reservations:
          cpus: "0.5"
          memory: "512MB"
  
  posts-service-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - 5009:5009
    env_file:
      - /etc/gathered/posts/.env
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1GB"
        reservations:
          cpus: "0.5"
          memory: "512MB"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    environment:
      RABBITMQ_DEFAULT_USER: "core"
      RABBITMQ_DEFAULT_PASS: "core"
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq

  db:
    image: postgres:17.1
    restart: always
    environment:
      POSTGRES_PASSWORD: superuser
      POSTGRES_USER: superuser
    ports:
      - 5432:5432
    volumes:
      - ./etc/database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro