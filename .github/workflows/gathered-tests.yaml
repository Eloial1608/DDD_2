name: 🧪 Tests


on:
  workflow_call:
    inputs:
      SERVICE:
        required: true
        type: string
      BRANCH:
        required: true
        type: string
      TAG:
        required: true
        type: string

jobs:
  tests:
    name: tests ${{inputs.SERVICE}}
    runs-on: ubuntu-latest
    concurrency:
      # Cancel old runs if there is a new commit in the same branch
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.SERVICE }}-tests
      cancel-in-progress: true
    timeout-minutes: 10

    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4
      
      # Instalación de Docker Compose si no está disponible
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose

      # Running tests
      - name: Run tests
        shell: sh
        run: |
          echo "*** Starting CI tests ***"
          docker-compose -f docker-compose.yml up -d db
          docker-compose -f docker-compose.yml run --rm --name ${{inputs.SERVICE}} -e DB_HOST=db --entrypoint="npm run test:${{inputs.SERVICE}}" ${{inputs.SERVICE}}
          docker ps -a
          docker-compose down ${{inputs.SERVICE}}
          docker compose ps
          echo "*** CI tests has passed SUCCESSFULLY ***"