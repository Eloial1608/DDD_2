name: 🧪 Unit-tests


on:
  workflow_call:
    inputs:
      SERVICE:
        required: true
        type: string
      BRANCH:
        required: true
        type: string
      TAG:
        required: true
        type: string

jobs:
  unit-tests:
    name: tests ${{inputs.SERVICE}}
    runs-on: ubuntu-latest
    concurrency:
      # Cancel old runs if there is a new commit in the same branch
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-unit-tests
      cancel-in-progress: true
    timeout-minutes: 10

    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4
      
      # Instalación de Docker Compose si no está disponible
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose

      # Running unit tests
      - name: Run unit tests
        shell: sh
        run: |
          echo "*** Starting CI unit tests ***"
          docker-compose -f docker-compose.yml up -d db
          docker-compose -f docker-compose.yml up ${{inputs.SERVICE}}  --entrypoint="npm run test:${{inputs.SERVICE}}"
          docker-compose down ${{inputs.SERVICE}}
          docker compose ps
          echo "*** CI unit tests has passed SUCCESSFULLY ***"