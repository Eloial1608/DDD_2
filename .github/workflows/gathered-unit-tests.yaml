name: 🧪 Unit-tests


on:
  workflow_call:
    inputs:
      SERVICE:
        required: true
        type: string
      BRANCH:
        required: true
        type: string
      TAG:
        required: true
        type: string

jobs:
  unit-tests:
    name: ${{inputs.SERVICE}}
    runs-on: ubuntu-latest
    concurrency:
      # Cancel old runs if there is a new commit in the same branch
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-unit-tests-${{inputs.SERVICE}}
      cancel-in-progress: true
    timeout-minutes: 10

    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4

      # Running unit tests
      - name: Run unit tests
        shell: sh
        env:
          SERVICE: ${{ inputs.SERVICE }}
        run: |
          if [ -z $SERVICE ]; then
            echo "*** Skiping CI unit tests ***"
          else
            echo "*** Starting CI unit tests ***"
            docker-compose up ${{inputs.SERVICE}}
            docker-compose exec docker-compose.yml ${{inputs.SERVICE}} npm run test:unit
            docker-compose down ${{inputs.SERVICE}}
            docker compose ps
            echo "*** CI unit tests has passed SUCCESSFULLY ***"
          fi