name: 🧪 Unit-tests


on:
  workflow_call:
    inputs:
      BRANCH:
        required: true
        type: string
      TAG:
        required: true
        type: string

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    concurrency:
      # Cancel old runs if there is a new commit in the same branch
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-unit-tests
      cancel-in-progress: true
    timeout-minutes: 10

    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4
      
      # Instalación de Docker Compose si no está disponible
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose

      # Running unit tests
      - name: Run unit tests
        shell: sh
        run: |
          echo "*** Starting CI unit tests ***"
          docker-compose up core-service-server
          docker-compose exec docker-compose.yml core-service-server npm run test:unit
          docker-compose down core-service-server
          docker compose ps
          echo "*** CI unit tests has passed SUCCESSFULLY ***"