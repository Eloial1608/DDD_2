name: 🧪 Feature-tests

on:
  workflow_call:
    inputs:
      SERVICE:
        required: true
        type: string
      BRANCH:
        required: true
        type: string
      TAG:
        required: true
        type: string

jobs:
  feature-tests:
    name: ${{inputs.SERVICE}}
    runs-on: ubuntu-latest
    container:
      image: docker/compose:latest
    concurrency:
      # Cancel old runs if there is a new commit in the same branch
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-feature-tests-${{inputs.SERVICE}}
      cancel-in-progress: true
    timeout-minutes: 10

    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4

      # Running feature tests
      - name: Run feature tests
        shell: sh
        env:
          SERVICE: ${{ inputs.SERVICE }}
        run: |
          if [ -z $SERVICE ]; then
            echo "*** Skiping CI feature tests ***"
          else
            echo "*** Starting CI feature tests ***"
            docker-compose up ${{inputs.SERVICE}}
            docker-compose exec docker-compose.yml ${{inputs.SERVICE}} npm run test:${{inputs.SERVICE}}:features
            docker-compose down ${{inputs.SERVICE}}
            docker compose ps
            echo "*** CI feature tests has passed SUCCESSFULLY ***"
          fi