services:
  Community.Repository:
    class: src/Contexts/Marketplace/Community/infrastructure/persistence/TypeOrmCommunityRepository
    arguments: ["@Shared.ORM.Connection"]

  User.Repository:
    class: src/Contexts/Marketplace/User/infrastructure/persistence/TypeOrmUserRepository
    arguments: ["@Shared.ORM.Connection"]

  Space.Repository:
    class: src/Contexts/Marketplace/Space/infrastructure/persistence/TypeOrmSpaceRepository
    arguments: ["@Shared.ORM.Connection"]

  Space.UpdateSpaceOnSpaceUpdated.Updater:
    class: src/Contexts/Course/Space/application/UpdateSpaceOnSpaceUpdated/Updater
    arguments: ['@Space.Repository', '@Shared.EventBus']
  
  Space.UpdateSpaceOnSpaceUpdated.UpdateSpaceOnSpaceUpdatedHandler:
    class: src/Contexts/Course/Space/application/UpdateSpaceOnSpaceUpdated/UpdateSpaceOnSpaceUpdatedHandler
    arguments: ["@Space.UpdateSpaceOnSpaceUpdated.Updater"]
    tags:
      - { name: "domainEventSubscriber" }
      
  Space.DeleteSpaceOnSpaceDeleted.Deleter:
    class: src/Contexts/Marketplace/Space/application/DeleteSpaceOnSpaceDeleted/Deleter
    arguments: ['@Space.Repository', '@Shared.EventBus']
  
  Space.DeleteSpaceOnSpaceDeleted.DeleteSpaceOnSpaceDeletedHandler:
    class: src/Contexts/Marketplace/Space/application/DeleteSpaceOnSpaceDeleted/DeleteSpaceOnSpaceDeletedHandler
    arguments: ["@Space.DeleteSpaceOnSpaceDeleted.Deleter"]
    tags:
      - { name: "domainEventSubscriber" }
      
  Space.FindById.FinderById:
    class: src/Contexts/Marketplace/Space/application/FindById/FinderById
    arguments: ['@Space.Repository']
  
  Space.FindById.FindSpaceByIdQueryHandler:
    class: src/Contexts/Marketplace/Space/application/FindById/FindSpaceByIdQueryHandler
    arguments: ['@Space.FindById.FinderById']
    tags:
      - { name: "queryHandler" }

  Space.CreateSpaceOnSpaceCreated.Creator:
    class: src/Contexts/Marketplace/Space/application/CreateSpaceOnSpaceCreated/Creator
    arguments: ['@Space.Repository', '@Shared.EventBus']
  
  Space.CreateSpaceOnSpaceCreated.CreateSpaceOnSpaceCreatedHandler:
    class: src/Contexts/Marketplace/Space/application/CreateSpaceOnSpaceCreated/CreateSpaceOnSpaceCreatedHandler
    arguments: ["@Space.CreateSpaceOnSpaceCreated.Creator"]
    tags:
      - { name: "domainEventSubscriber" }

  User.DeleteUserOnUserDeleted.Deleter:
    class: src/Contexts/Marketplace/User/application/DeleteUserOnUserDeleted/Deleter
    arguments: ['@User.Repository', '@Shared.EventBus']
  
  User.DeleteUserOnUserDeleted.DeleteUserOnUserDeletedHandler:
    class: src/Contexts/Marketplace/User/application/DeleteUserOnUserDeleted/DeleteUserOnUserDeletedHandler
    arguments: ["@User.DeleteUserOnUserDeleted.Deleter"]
    tags:
      - { name: "domainEventSubscriber" }

  User.CreateUserOnUserCreated.Creator:
    class: src/Contexts/Marketplace/User/application/CreateUserOnUserCreated/Creator
    arguments: ['@User.Repository', '@Shared.EventBus']
  
  User.CreateUserOnUserCreated.CreateUserOnUserCreatedHandler:
    class: src/Contexts/Marketplace/User/application/CreateUserOnUserCreated/CreateUserOnUserCreatedHandler
    arguments: ["@User.CreateUserOnUserCreated.Creator"]
    tags:
      - { name: "domainEventSubscriber" }
