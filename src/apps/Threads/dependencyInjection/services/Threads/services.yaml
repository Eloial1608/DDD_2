services:
   Community.Repository:
    class: src/Contexts/Posts/Community/infrastructure/persistence/TypeOrmCommunityRepository
    arguments: ["@Shared.ORM.Connection"]

   Community.CreateCommunityOnCommunityCreated.Creator:
    class: src/Contexts/Threads/Community/application/CreateCommunityOnCommunityCreated/Creator
    arguments: ['@Community.Repository', '@Shared.EventBus']
  
   Community.CreateCommunityOnCommunityCreated.CreateCommunityOnCommunityCreatedHandler:
    class: src/Contexts/Threads/Community/application/CreateCommunityOnCommunityCreated/CreateCommunityOnCommunityCreatedHandler
    arguments: ["@Community.CreateCommunityOnCommunityCreated.Creator"]
    tags:
      - { name: "domainEventSubscriber" }

   User.Repository:
    class: src/Contexts/Threads/User/infrastructure/persistence/TypeOrmUserRepository
    arguments: ["@Shared.ORM.Connection"]