services:
   Community.Repository:
    class: src/Contexts/Threads/Community/infrastructure/persistence/TypeOrmCommunityRepository
    arguments: ["@Shared.ORM.Connection"]

   Community.CreateCommunityOnCommunityCreated.Creator:
    class: src/Contexts/Threads/Community/application/CreateCommunityOnCommunityCreated/Creator
    arguments: ['@Community.Repository', '@Shared.EventBus']
  
   Community.CreateCommunityOnCommunityCreated.CreateCommunityOnCommunityCreatedHandler:
    class: src/Contexts/Threads/Community/application/CreateCommunityOnCommunityCreated/CreateCommunityOnCommunityCreatedHandler
    arguments: ["@Community.CreateCommunityOnCommunityCreated.Creator"]
    tags:
      - { name: "domainEventSubscriber" }


   User.Repository:
    class: src/Contexts/Threads/User/infrastructure/persistence/TypeOrmUserRepository
    arguments: ["@Shared.ORM.Connection"]

   Community.DeleteCommunityOnCommunityDeleted.Deleter:
    class: src/Contexts/Threads/Community/application/DeleteCommunityOnCommunityDeleted/Deleter
    arguments: ['@Community.Repository', '@Shared.EventBus']
  
   Community.DeleteCommunityOnCommunityDeleted.DeleteCommunityOnCommunityDeletedHandler:
    class: src/Contexts/Threads/Community/application/DeleteCommunityOnCommunityDeleted/DeleteCommunityOnCommunityDeletedHandler
    arguments: ["@Community.DeleteCommunityOnCommunityDeleted.Deleter"]
    tags:
      - { name: "domainEventSubscriber" }
    
   Community.FindById.FinderById:
    class: src/Contexts/Threads/Community/application/FindById/FinderById
    arguments: ['@Community.Repository']
  
   Community.FindById.FindCommunityByIdQueryHandler:
    class: src/Contexts/Threads/Community/application/FindById/FindCommunityByIdQueryHandler
    arguments: ['@Community.FindById.FinderById']
    tags:
      - { name: "queryHandler" }

   Space.Repository:
    class: src/Contexts/Threads/Space/infrastructure/persistence/TypeOrmSpaceRepository
    arguments: ["@Shared.ORM.Connection"]


   SpaceMember.Repository:
    class: src/Contexts/Media/SpaceMember/infrastructure/persistence/TypeOrmSpaceMemberRepository
    arguments: ["@Shared.ORM.Connection"]
