services:
  Space.Repository:
    class: src/Contexts/Posts/Space/infrastructure/persistence/TypeOrmSpaceRepository
    arguments: ["@Shared.ORM.Connection"]

  Space.CreateSpaceOnSpaceCreated.Creator:
    class: src/Contexts/Posts/Space/application/CreateSpaceOnSpaceCreated/Creator
    arguments: ['@Space.Repository', '@Shared.EventBus']
  
  Space.CreateSpaceOnSpaceCreated.CreateSpaceOnSpaceCreatedHandler:
    class: src/Contexts/Posts/Space/application/CreateSpaceOnSpaceCreated/CreateSpaceOnSpaceCreatedHandler
    arguments: ["@Space.CreateSpaceOnSpaceCreated.Creator"]
    tags:
      - { name: "domainEventSubscriber" }
  
  Space.DeleteSpaceOnSpaceDeleted.Deleter:
    class: src/Contexts/Posts/Space/application/DeleteSpaceOnSpaceDeleted/Deleter
    arguments: ['@Space.Repository', '@Shared.EventBus']
  
  Space.DeleteSpaceOnSpaceDeleted.DeleteSpaceOnSpaceDeletedHandler:
    class: src/Contexts/Posts/Space/application/DeleteSpaceOnSpaceDeleted/DeleteSpaceOnSpaceDeletedHandler
    arguments: ["@Space.DeleteSpaceOnSpaceDeleted.Deleter"]
    tags:
      - { name: "domainEventSubscriber" }
  