services:
  Course.Repository:
    class: src/Contexts/Course/Course/infrastructure/persistence/TypeOrmCourseRepository
    arguments: ["@Shared.ORM.Connection"]

  Community.Repository:
    class: src/Contexts/Course/Community/infrastructure/persistence/TypeOrmCommunityRepository
    arguments: ["@Shared.ORM.Connection"]


    Community.CreateCommunityOnCommunityCreated.Creator:
    class: src/Contexts/Course/Community/application/CreateCommunityOnCommunityCreated/Creator
    arguments: ['@Community.Repository', '@Shared.EventBus']
  
    Community.CreateCommunityOnCommunityCreated.CreateCommunityOnCommunityCreatedHandler:
    class: src/Contexts/Course/Community/application/CreateCommunityOnCommunityCreated/CreateCommunityOnCommunityCreatedHandler
    arguments: ["@Community.CreateCommunityOnCommunityCreated.Creator"]
    tags:
      - { name: "domainEventSubscriber" }

  User.Repository:
    class: src/Contexts/Course/User/infrastructure/persistence/TypeOrmCommunityRepository
    arguments: ["@Shared.ORM.Connection"]

  Space.Repository:
    class: src/Contexts/Course/Space/infrastructure/persistence/TypeOrmSpaceRepository
    arguments: ["@Shared.ORM.Connection"]

  User.Create.Creator:
    class: src/Contexts/Course/User/application/CreateUserOnUserCreated/Creator
    arguments: ['@User.Repository', '@Shared.EventBus']
  
  User.Create.CreateUserOnUserCreatedHandler:
    class: src/Contexts/Course/User/application/CreateUserOnUserCreated/CreateUserOnUserCreatedHandler
    arguments: ["@User.CreateUserOnUserCreated.Creator"]
    tags:
      - { name: "commandHandler" }

  Space.UpdateSpaceOnSpaceUpdated.Updater:
    class: src/Contexts/Course/Space/application/UpdateSpaceOnSpaceUpdated/Updater
    arguments: ['@Space.Repository', '@Shared.EventBus']
  
  Space.UpdateSpaceOnSpaceUpdated.UpdateSpaceOnSpaceUpdatedHandler:
    class: src/Contexts/Course/Space/application/UpdateSpaceOnSpaceUpdated/UpdateSpaceOnSpaceUpdatedHandler
    arguments: ["@Space.UpdateSpaceOnSpaceUpdated.Updater"]
    tags:
      - { name: "domainEventSubscriber" }
