services:
  Community.Repository:
    class: src/Contexts/Core/Community/infrastructure/persistence/TypeOrmCommunityRepository
    arguments: ["@Shared.ORM.Connection"]
  
  Community.Create.Creator:
    class: src/Contexts/Core/Community/application/Create/Creator
    arguments: ['@Community.Repository', '@Shared.EventBus']
  
  Community.Create.CreateCommunityCommandHandler:
    class: src/Contexts/Core/Community/application/Create/CreateCommunityCommandHandler
    arguments: ["@Community.Create.Creator"]
    tags:
      - { name: "commandHandler" }
  
  Community.FindById.FinderById:
    class: src/Contexts/Core/Community/application/FindById/FinderById
    arguments: ['@Community.Repository']
  
  Community.FindById.FindCommunityByIdQueryHandler:
    class: src/Contexts/Core/Community/application/FindById/FindCommunityByIdQueryHandler
    arguments: ['@Community.FindById.FinderById']
    tags:
      - { name: "queryHandler" }
  
  Community.FindByCriteria.FinderByCriteria:
    class: src/Contexts/Core/Community/application/FindByCriteria/FinderByCriteria
    arguments: ['@Community.Repository']
  
  Community.FindByCriteria.FindCommunitiesByCriteriaQueryHandler:
    class: src/Contexts/Core/Community/application/FindByCriteria/FindCommunitiesByCriteriaQueryHandler
    arguments: ['@Community.FindByCriteria.FinderByCriteria']
    tags:
      - { name: "queryHandler" }
  
  Community.Delete.Deleter:
    class: src/Contexts/Core/Community/application/Delete/Deleter
    arguments: ['@Community.Repository', '@Shared.EventBus']
  
  Community.Delete.DeleteCommunityCommandHandler:
    class: src/Contexts/Core/Community/application/Delete/DeleteCommunityCommandHandler
    arguments: ["@Community.Delete.Deleter"]
    tags:
      - { name: "commandHandler" }
  
  Plan.Repository:
    class: src/Contexts/Core/Plan/infrastructure/persistence/TypeOrmPlanRepository
    arguments: ["@Shared.ORM.Connection"]