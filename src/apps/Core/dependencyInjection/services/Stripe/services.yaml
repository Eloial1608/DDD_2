services:
  StripeAccount.Repository:
    class: src/Contexts/Stripe/StripeAccount/infrastructure/persistence/TypeOrmStripeAccountRepository
    arguments: ["@Shared.ORM.Connection"]
  
  StripeAccount.Create.Creator:
    class: src/Contexts/Stripe/StripeAccount/application/Create/Creator
    arguments: ['@StripeAccount.Repository', '@Shared.EventBus']
  
  StripeAccount.Create.CreateStripeAccountCommandHandler:
    class: src/Contexts/Stripe/StripeAccount/application/Create/CreateStripeAccountCommandHandler
    arguments: ["@StripeAccount.Create.Creator"]
    tags:
      - { name: "commandHandler" }
  
  StripeAccount.Update.Updater:
    class: src/Contexts/Stripe/StripeAccount/application/Update/Updater
    arguments: ['@StripeAccount.Repository', '@Shared.EventBus']
  
  StripeAccount.Update.UpdateStripeAccountCommandHandler:
    class: src/Contexts/Stripe/StripeAccount/application/Update/UpdateStripeAccountCommandHandler
    arguments: ["@StripeAccount.Update.Updater"]
    tags:
      - { name: "commandHandler" }