services:
  core-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    command: ["start:core:server"]

  metrics-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    command: ["start:metrics:server"]    

  threads-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    command: ["start:threads:server"]
  
  course-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    command: ["start:course:server"]
  
  events-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    command: ["start:events:server"]
  
  auth-service-server:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PORT: 5004
    ports:
      - 5004:5004
    command: ["start:auth:server"]

  media-service-server:
    restart: always
